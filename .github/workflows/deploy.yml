name: Production deploy

on:
  workflow_dispatch:

concurrency:
  group: production_deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Add Zone server host key (avoids SSH "verification failed")
        run: mkdir -p ~/.ssh && chmod 700 ~/.ssh && ssh-keyscan -H ta24aksalu.itmajakas.ee >> ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Preflight — fototeek path writable & current not a plain directory
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes virt137753@ta24aksalu.itmajakas.ee 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE="$HOME/domeenid/www.ta24aksalu.itmajakas.ee/fototeek"
          if ! mkdir -p "$BASE" 2>/dev/null; then
            echo "::error::Cannot create or access $BASE (permissions?). Fix Zone folder ownership."
            exit 1
          fi
          if [ -e "$BASE/current" ] && [ ! -L "$BASE/current" ]; then
            echo "::error::Deployer needs $BASE/current to be a symlink, but it is a real directory/file."
            echo "SSH to server and run: mv \"$BASE/current\" \"$BASE/current.backup-manual\""
            exit 1
          fi
          echo "OK: $BASE — current is absent or a symlink."
          ls -la "$BASE" || true
          REMOTE

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Deploy (Deployer)
        uses: deployphp/action@v1
        with:
          deployer-version: "7.5.12"
          dep: deploy stage
          skip-ssh-setup: true
          verbosity: -vvv
