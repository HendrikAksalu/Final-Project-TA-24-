name: Production deploy

on:
  workflow_dispatch:

concurrency:
  group: production_deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Add Zone server host key (avoids SSH "verification failed")
        run: mkdir -p ~/.ssh && chmod 700 ~/.ssh && ssh-keyscan -H ta24aksalu.itmajakas.ee >> ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Deploy (Deployer)
        uses: deployphp/action@v1
        with:
          deployer-version: "7.5.12"
          dep: deploy stage
          skip-ssh-setup: true
          verbosity: -vvv
